<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A9834B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A26A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE4D8;stop-opacity:1" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <!-- Inner dashed ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C8A26A" stroke-width="0.4" stroke-dasharray="4 3"/>

  <!-- Qatar West Bay skyline silhouette at bottom -->
  <g clip-path="url(#circle-clip)" opacity="0.85">
    <rect x="4" y="148" width="192" height="48" fill="url(#bgGrad)"/>
    <!-- Skyline buildings -->
    <rect x="18" y="138" width="10" height="10" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="28" y="142" width="6" height="6" fill="url(#goldGrad)" rx="0.3"/>
    <rect x="38" y="122" width="13" height="26" fill="url(#goldGrad)" rx="1"/>
    <rect x="41" y="116" width="7" height="8" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="43" y="112" width="3" height="6" fill="url(#goldGrad)" rx="0.3"/>
    <rect x="55" y="130" width="9" height="18" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="70" y="108" width="16" height="40" fill="url(#goldGrad)" rx="1"/>
    <polygon points="78,100 74,108 82,108" fill="url(#goldGrad)"/>
    <rect x="92" y="114" width="14" height="34" fill="url(#goldGrad)" rx="1"/>
    <rect x="95" y="109" width="8" height="7" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="98" y="104" width="2" height="7" fill="url(#goldGrad)" rx="0.3"/>
    <rect x="110" y="120" width="12" height="28" fill="url(#goldGrad)" rx="0.8"/>
    <rect x="112" y="116" width="8" height="6" fill="url(#goldGrad)" rx="0.4"/>
    <polygon points="128,148 133,148 134,118 127,118" fill="url(#goldGrad)"/>
    <rect x="129" y="112" width="4" height="8" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="140" y="132" width="14" height="16" fill="url(#goldGrad)" rx="0.8"/>
    <rect x="158" y="126" width="10" height="22" fill="url(#goldGrad)" rx="0.5"/>
    <rect x="171" y="134" width="8" height="14" fill="url(#goldGrad)" rx="0.4"/>
    <line x1="4" y1="148" x2="196" y2="148" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Sunray accent — subtle rays from center top, referencing "Badaru = sun" -->
  <g opacity="0.12">
    <line x1="100" y1="20" x2="100" y2="5"  stroke="#C8A26A" stroke-width="1.5"/>
    <line x1="118" y1="25" x2="124" y2="11" stroke="#C8A26A" stroke-width="1"/>
    <line x1="82"  y1="25" x2="76"  y2="11" stroke="#C8A26A" stroke-width="1"/>
    <line x1="132" y1="36" x2="142" y2="26" stroke="#C8A26A" stroke-width="0.8"/>
    <line x1="68"  y1="36" x2="58"  y2="26" stroke="#C8A26A" stroke-width="0.8"/>
  </g>

  <!-- Monogram "N" — NIORA brand mark -->
  <text
    x="100"
    y="108"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
    font-size="58"
    font-weight="600"
    letter-spacing="2"
    fill="url(#goldGrad)"
  >N</text>

  <!-- Thin gold rule below monogram -->
  <line x1="70" y1="114" x2="130" y2="114" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.65"/>
</svg>
